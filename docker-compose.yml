services:
  app:
    build: .
    ports:
      - "3010:3010"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - MONGODB_URI=mongodb://mongo:27017/xanascript
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - NODE_ENV=production
      - PORT=3010
      - XS_BIN=${XS_BIN:-/xanascript/bin/xs.js}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - SITE_URL=${SITE_URL:-http://localhost:3010}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_data:
